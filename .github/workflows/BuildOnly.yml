name: BuildOnly

on:
  push:
    branches-ignore:
      - main

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET (With cache)
        uses: actions/setup-dotnet@v6.0.0
        with:
         dotnet-version: |
            10.0.x
         cache: true
         cache-dependency-path: |
           **/Directory.Packages.props
           **/Directory.Build.props
           **/Directory.Build.targets
           **/*.slnx
           **/*.sln
           **/*.csproj
           **/global.json
           **/nuget.config

      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.slnx', '**/*.sln', '**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages.lock.json', '**/nuget.config') }}
      - name: 'Run: Test'
        run: ./build.cmd Test
